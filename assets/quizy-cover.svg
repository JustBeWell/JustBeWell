<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Quizy — Entre apuntes y retos</title>
  <desc id="desc">Composición visual de Quizy, una plataforma educativa funcional para practicar, revisar errores y avanzar.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f1fbf9"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102235"/>
      <stop offset="100%" stop-color="#19374b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#102235" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="26" fill="url(#sky)"/>
  <circle cx="1090" cy="70" r="150" fill="#d9f8f1" opacity="0.72"/>
  <circle cx="100" cy="650" r="160" fill="#fff0d7" opacity="0.72"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="70" font-size="27" font-weight="700" fill="#102235">quizy</text>
    <circle cx="137" cy="60" r="6" fill="#6de0d3"/>
    <text x="173" y="70" font-size="16" fill="#627588">Entre apuntes y retos</text>
    <text x="910" y="70" font-size="15" font-weight="700" fill="#102235">APP FUNCIONAL</text>
    <rect x="1060" y="48" width="70" height="30" rx="15" fill="#d9f8f1"/>
    <circle cx="1078" cy="63" r="5" fill="#2ca98e"/>
    <text x="1089" y="69" font-size="12" font-weight="700" fill="#237967">LIVE</text>
  </g>
  <rect x="56" y="112" width="1088" height="230" rx="24" fill="url(#hero)"/>
  <path d="M56 300 C270 218 350 360 570 265 S885 245 1144 170 V342 H56 Z" fill="#244c5f" opacity="0.48"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="102" y="180" font-size="18" font-weight="700" letter-spacing="2" fill="#6de0d3">APRENDE A TU RITMO</text>
    <text x="102" y="232" font-size="42" font-weight="700" fill="#ffffff">Tu próximo examen.</text>
    <text x="102" y="280" font-size="42" font-weight="700" fill="#ffffff">Un paso más cerca.</text>
    <text x="102" y="316" font-size="16" fill="#b9c9db">Practica, entiende tus errores y mide tu progreso.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="142" width="370" height="250" rx="18" fill="#ffffff"/>
    <rect x="728" y="170" width="150" height="12" rx="6" fill="#d8e8e8"/>
    <rect x="728" y="194" width="236" height="12" rx="6" fill="#edf2f4"/>
    <rect x="728" y="232" width="314" height="60" rx="12" fill="#f4fbfa" stroke="#d9f8f1"/>
    <circle cx="760" cy="262" r="16" fill="#d9f8f1"/>
    <path d="M752 262 l6 6 11-13" fill="none" stroke="#2ca98e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="789" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#102235">Repaso inteligente</text>
    <text x="789" y="278" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#627588">Vuelve a lo que más necesitas</text>
    <rect x="728" y="310" width="140" height="12" rx="6" fill="#ffe5b8"/>
    <rect x="884" y="310" width="158" height="12" rx="6" fill="#e9e1ff"/>
    <rect x="728" y="342" width="200" height="28" rx="14" fill="#102235"/>
    <text x="770" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Continuar práctica</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="410" font-size="15" font-weight="700" letter-spacing="2" fill="#627588">TODO LO QUE NECESITAS PARA AVANZAR</text>
    <g filter="url(#shadow)">
      <rect x="72" y="442" width="240" height="154" rx="18" fill="#ffffff"/>
      <rect x="336" y="442" width="240" height="154" rx="18" fill="#ffffff"/>
      <rect x="600" y="442" width="240" height="154" rx="18" fill="#ffffff"/>
      <rect x="864" y="442" width="240" height="154" rx="18" fill="#ffffff"/>
    </g>
    <circle cx="110" cy="486" r="18" fill="#d9f8f1"/>
    <text x="101" y="493" font-size="20" font-weight="700" fill="#237967">✓</text>
    <text x="96" y="535" font-size="16" font-weight="700" fill="#102235">Practica</text>
    <text x="96" y="560" font-size="13" fill="#627588">Tests por tema y nivel</text>
    <circle cx="374" cy="486" r="18" fill="#fff0d7"/>
    <text x="365" y="493" font-size="20" font-weight="700" fill="#c87b16">↺</text>
    <text x="360" y="535" font-size="16" font-weight="700" fill="#102235">Revisa</text>
    <text x="360" y="560" font-size="13" fill="#627588">Aprende de cada error</text>
    <circle cx="638" cy="486" r="18" fill="#e9e1ff"/>
    <text x="629" y="493" font-size="20" font-weight="700" fill="#7454ba">↗</text>
    <text x="624" y="535" font-size="16" font-weight="700" fill="#102235">Mide</text>
    <text x="624" y="560" font-size="13" fill="#627588">Sigue tu progreso real</text>
    <circle cx="902" cy="486" r="18" fill="#dce9ff"/>
    <text x="893" y="493" font-size="20" font-weight="700" fill="#3970b7">✦</text>
    <text x="888" y="535" font-size="16" font-weight="700" fill="#102235">Compite</text>
    <text x="888" y="560" font-size="13" fill="#627588">Duelos privados con amigos</text>
  </g>
</svg>
